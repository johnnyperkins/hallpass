# Hallpass daemon configuration.

# Verdict applied when no rule matches and no client answers the prompt
# in time: "allow", "deny", or "reject".
default_verdict = "allow"

# Seconds to wait for an interactive prompt reply before applying the
# default verdict.
prompt_timeout_secs = 15

# NFQUEUE queue number the daemon binds to.
queue_num = 0

# Unix socket for CLI/UI clients.
socket_path = "/run/hallpass/hallpass.sock"

# Maximum number of connections held waiting for a prompt reply.
max_pending_prompts = 64

# Verdict for packets whose transport the rule engine does not model
# (SCTP, ICMP, ...) or that fail to parse: "allow", "deny", or "reject".
# Rules never see these; they are only counted. "allow" keeps ping and
# friends working.
unhandled_proto_verdict = "allow"

# Whether the verdict queue fails open (`true`: traffic flows when the
# daemon is dead or the queue is full) or closed (`false`: those packets
# are dropped). See etc/config.hardened.toml.
queue_bypass = true

# Optional: export every decided connection to syslog. Omit the whole
# [syslog] section for no export. Export is a plain event subscriber, so
# a stalled collector costs events, never verdicts. Facility is auth, so
# distro configs usually route these to auth.log; severity is warning for
# deny/reject and info for allow.
#
# [syslog]
# format = "rfc5424"          # rfc5424 (structured data) | json
# [syslog.target]
# kind = "local"              # local syslog datagram socket
# path = "/dev/log"
#
# ...or a remote collector. The address must be a literal IP and port
# (no hostnames: resolving one would run through the daemon's own DNS
# path at startup). Export datagrams are themselves outbound traffic and
# get filtered like any other, so add a rule allowing hallpassd to reach
# the collector - otherwise a default-deny posture blocks its own logs.
# [syslog.target]
# kind = "udp"
# addr = "10.0.0.9:514"
