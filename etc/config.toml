# Hallpass daemon configuration. See docs/guide.md.

# "enforce" applies verdicts. "observe" evaluates and records every verdict
# but lets every packet through: nothing is blocked. Unmatched connections
# record default_verdict and never prompt. This is only the starting mode;
# `hallpass-cli config set` and the GUI's Enforce switch change it until the
# next restart.
mode = "enforce"

# Verdict when no rule matches and nobody answers the prompt in time:
# "allow", "deny" or "reject".
#
# This also covers a host with no GUI or `hallpass-cli watch` attached, the
# time between boot and login, and a full prompt table, so anything that
# needs the network before a human can answer needs a rule. The
# 20-system-*.toml files in rules.d are that baseline; add to them rather
# than relaxing this. A dead daemon is governed by queue_bypass instead.
default_verdict = "deny"

# Seconds a prompt waits before default_verdict applies. The packet is held
# for the whole wait.
prompt_timeout_secs = 30

# NFQUEUE number to bind. The DNS snoop queue uses the next one.
queue_num = 0

# Unix socket for CLI and GUI clients.
socket_path = "/run/hallpass/hallpass.sock"

# Most connections held waiting for an answer. Beyond this, new ones get
# default_verdict without a prompt. Keep it generous enough for a burst
# (a browser restoring tabs, a package update).
max_pending_prompts = 128

# Verdict for transports rules cannot model (ICMP, SCTP, ...) and packets
# that fail to parse: "allow", "deny" or "reject". "allow" keeps ping
# working.
unhandled_proto_verdict = "allow"

# true: traffic flows when the daemon is dead or its queue is full.
# false: those packets are dropped (see config.hardened.toml).
# Starting in observe mode always fails open on a full queue; switching to
# observe at runtime does not, so a measurement run on a fail-closed host
# should set mode above.
queue_bypass = true

# Also cut established flows that a changed ruleset denies, so a new deny
# rule stops a running VPN or websocket rather than only the next
# connection. Never active in observe mode.
kill_established = true

# Count bytes and packets per flow from conntrack teardown events, for
# `status` and the journal. Needs the sysctls
# net.netfilter.nf_conntrack_acct=1 and nf_conntrack_events=1. Never
# affects a verdict.
flow_accounting = false

# Flag programs, and destinations, the daemon has not seen before (NEW on
# prompts, new=app/new=dest in events, first_seen in syslog export). The
# state file lists which programs contacted which destinations, root-only,
# rewritten at most once a minute. Deleting it is safe. Never affects a
# verdict.
first_seen = true
first_seen_state = "/var/lib/hallpass/seen.toml"

# Optional syslog export of every decided connection. Facility auth;
# severity warning for deny/reject, info for allow. A slow collector loses
# events, never verdicts.
#
# [syslog]
# format = "rfc5424"          # rfc5424 | json
# [syslog.target]
# kind = "local"              # local syslog datagram socket
# path = "/dev/log"
#
# ...or a remote collector, as a literal IP and port (hostnames would be
# resolved through the daemon's own DNS path at startup). The daemon's
# export traffic bypasses the verdict queue, so it needs no rule.
# [syslog.target]
# kind = "udp"
# addr = "10.0.0.9:514"
