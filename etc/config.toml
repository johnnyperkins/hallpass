# Hallpass daemon configuration.

# "enforce" (default) applies every verdict. "observe" evaluates policy,
# records what it decided, and lets every packet through anyway: nothing is
# blocked while it is on.
#
# Observe mode answers "what would this policy break" without the outage,
# and it is the fastest way to find out what a host talks to at all. Watch
# it with `hallpass-cli top` or `hallpass-cli events`; a recorded block
# shows up as WOULD-DENY, and `hallpass-cli status` reports the mode.
# Unmatched connections are recorded as default_verdict and never prompt,
# since answering a prompt that changes nothing would be misleading.
#
# This only decides the mode the daemon starts in: the GUI's Enforce
# switch flips it at runtime, until the next restart returns to this file.
mode = "enforce"

# Verdict applied when no rule matches and no client answers the prompt
# in time: "allow", "deny", or "reject".
default_verdict = "allow"

# Seconds to wait for an interactive prompt reply before applying the
# default verdict.
prompt_timeout_secs = 15

# NFQUEUE queue number the daemon binds to.
queue_num = 0

# Unix socket for CLI/UI clients.
socket_path = "/run/hallpass/hallpass.sock"

# Maximum number of connections held waiting for a prompt reply.
max_pending_prompts = 64

# Verdict for packets whose transport the rule engine does not model
# (SCTP, ICMP, ...) or that fail to parse: "allow", "deny", or "reject".
# Rules never see these; they are only counted. "allow" keeps ping and
# friends working.
unhandled_proto_verdict = "allow"

# Whether the verdict queue fails open (`true`: traffic flows when the
# daemon is dead or the queue is full) or closed (`false`: those packets
# are dropped). See etc/config.hardened.toml. Starting in observe mode
# (`mode = "observe"` below) fails open on a full queue whatever this
# says, since a dropped packet there would contradict the one thing that
# mode promises; toggling to observe at runtime does not relax it, so a
# measurement run on a fail-closed host wants the mode set here.
queue_bypass = true

# When the ruleset changes, delete the conntrack entries of established
# flows the new ruleset denies, so a deny rule applies to running
# connections rather than only the next one. The flow's next packet is
# then judged as a new connection by the same rules as any other. Off,
# a long-lived connection (a VPN, a websocket) opened before a deny rule
# keeps flowing until it ends on its own. Never active in observe mode.
kill_established = true

# Optional: export every decided connection to syslog. Omit the whole
# [syslog] section for no export. Export is a plain event subscriber, so
# a stalled collector costs events, never verdicts. Facility is auth, so
# distro configs usually route these to auth.log; severity is warning for
# deny/reject and info for allow.
#
# [syslog]
# format = "rfc5424"          # rfc5424 (structured data) | json
# [syslog.target]
# kind = "local"              # local syslog datagram socket
# path = "/dev/log"
#
# ...or a remote collector. The address must be a literal IP and port
# (no hostnames: resolving one would run through the daemon's own DNS
# path at startup). Export datagrams skip the verdict queue: the daemon
# marks its own export socket and the ruleset accepts that mark, so no
# rule is needed for the collector and a default-deny posture does not
# block the daemon's own logs. That exemption is not a convenience - an
# unanswered UDP flow never leaves `ct state new`, so without it every
# exported event produced a datagram that produced another event.
# [syslog.target]
# kind = "udp"
# addr = "10.0.0.9:514"
