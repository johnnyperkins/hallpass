# Hallpass daemon configuration: hardened posture. See docs/security.md.
#
# Denies what no rule allows, what nobody answers, and what the rule engine
# cannot model, and keeps enforcing when the daemon is dead or overloaded.
# The remaining gap is root, which can delete the nftables table. Keys not
# set here take the defaults documented in config.toml.

# Stated explicitly: a hardened config that silently does not enforce is the
# worst outcome. Socket clients can still switch to observe until the next
# restart, which grants nothing new; the socket group can already delete
# every rule.
mode = "enforce"

default_verdict = "deny"

# Short, so a stalled prompt handler blocks quickly.
prompt_timeout_secs = 10

queue_num = 0
socket_path = "/run/hallpass/hallpass.sock"
max_pending_prompts = 128

# Drop ICMP, SCTP and anything else rules cannot see.
unhandled_proto_verdict = "deny"

# Stated because this posture denies what nobody answers: NEW on a prompt
# is the difference between approving a familiar program and one that has
# never run here.
first_seen = true

# Fail closed: new connections are dropped when the daemon is dead or its
# queue is full. A crashed daemon takes new outbound connections down until
# it restarts; established flows keep working, and a clean shutdown removes
# the table. The DNS snoop queues always fail open.
queue_bypass = false
