[package]
name = "hallpass-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hallpass application firewall desktop UI"

[dependencies]
hallpass-types = { path = "../hallpass-types" }
# The agent and window link (src/link.rs) frames its own messages.
serde = { workspace = true }
# Safe dup2 over stdin, so the link leaves fd 0 (src/link.rs), and pidfds
# for killing a stuck prompt window (src/agent.rs); already in the tree
# through hallpass-cli.
rustix = { version = "1", features = ["process", "stdio"] }
eframe = "0.35"
# Table only (virtualized rows with a fixed header, width-filling columns);
# every optional feature stays off.
egui_extras = { version = "0.35", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { workspace = true, features = [
    "rt",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify-rust = "4"
# StatusNotifierItem tray icon (see src/tray.rs). The async-io flavor, NOT
# the default tokio one: features unify, so ksni's default would flip the
# whole tree's zbus to its tokio flavor, and notify-rust's zbus calls run
# on a plain thread where that flavor panics ("there is no reactor
# running"), observed live before this pin.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
# Only for the EventLoopBuilderExt traits that pin a window's backend (see
# src/backend.rs). Version must track eframe's own winit.
winit = { version = "0.30", default-features = false, features = ["wayland", "x11"] }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.35.0", default-features = false }
