[package]
name = "hallpass-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hallpass application firewall desktop UI"

[dependencies]
hallpass-types = { path = "../hallpass-types" }
eframe = "0.35"
# Table only (virtualized rows with a fixed header, width-filling columns);
# every optional feature stays off.
egui_extras = { version = "0.35", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { workspace = true, features = [
    "rt",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify-rust = "4"

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.35.0", default-features = false }
