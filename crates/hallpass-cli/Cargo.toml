[package]
name = "hallpass-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hallpass application firewall CLI"

[dependencies]
hallpass-types = { path = "../hallpass-types" }
serde = { workspace = true }
serde_json = { workspace = true }
# Same version the daemon reads rule files with, so `rules export` cannot
# emit a document the daemon's own parser would reject.
toml = "0.8"
# prctl (PR_SET_CHILD_SUBREAPER), wait and kill for `run`: the workspace
# denies unsafe code, so the syscalls come from a wrapper crate rather than
# raw libc. rustix over nix because it is already in the dependency tree.
rustix = { version = "1", features = ["process"] }
tokio = { workspace = true, features = [
    "rt",
    "net",
    "macros",
    "io-util",
    "io-std",
    "signal",
    "sync",
    "time",
] }

[lints]
workspace = true
