[package]
name = "sentineld"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sentinel application firewall daemon"

[features]
# eBPF attribution. Requires a prior `cargo xtask build-ebpf` so the
# object exists at target/bpfel-unknown-none/release/sentinel-ebpf; the
# default build works without it (procfs attribution only).
ebpf = ["dep:aya", "dep:sentinel-ebpf-common"]

[dependencies]
sentinel-types = { path = "../sentinel-types" }
sentinel-ebpf-common = { path = "../sentinel-ebpf-common", features = ["user"], optional = true }
aya = { version = "0.14", optional = true }
serde = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
    "io-util",
] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
nfq = "0.2"
etherparse = "0.16"
ipnet = "2"
globset = "0.4"
notify = "8"
arc-swap = "1"
lru = "0.12"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
