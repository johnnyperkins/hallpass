[package]
name = "hallpassd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hallpass application firewall daemon"

[features]
# eBPF attribution. Requires a prior `cargo xtask build-ebpf` so the
# object exists at target/bpfel-unknown-none/release/hallpass-ebpf; the
# default build works without it (procfs attribution only).
ebpf = ["dep:aya", "dep:hallpass-ebpf-common"]
# Synthetic connection events for client development (`cargo xtask dev`).
# Never enable for a real host: it fabricates events, and everything
# downstream of the event bus, syslog export included, treats them as real.
dev-fixtures = []

[dependencies]
hallpass-types = { path = "../hallpass-types" }
hallpass-ebpf-common = { path = "../hallpass-ebpf-common", features = ["user"], optional = true }
aya = { version = "0.14", optional = true }
serde = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
    "io-util",
] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1"
nfq = "0.2"
etherparse = "0.16"
ipnet = "2"
globset = "0.4"
notify = "8"
arc-swap = "1"
lru = "0.18"
sha2 = { workspace = true }
# AF_NETLINK socket for the sock_diag attribution path; the daemon denies
# unsafe_code and std has no netlink socket. Chosen over neli (proc-macro
# subtree) for pulling only bytes, libc and log, all already in the tree.
netlink-sys = { version = "0.8", default-features = false }
# SO_MARK on the syslog export socket, so the daemon's own log traffic can
# be exempted from its own verdict queue (see nft::EXPORT_MARK). std cannot
# set it and this crate denies unsafe_code, so the raw setsockopt has to come
# from somewhere; socket2 is already in the tree under tokio.
# "all" is not optional: set_mark lives behind that feature. It compiles
# without it only because tokio happens to enable it, which is a dependency
# of a dependency's choice to rely on.
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true }

[lints]
workspace = true
