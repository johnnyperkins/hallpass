[workspace]
resolver = "2"
members = [
    "crates/hallpass-types",
    "crates/hallpass-ebpf-common",
    "crates/hallpassd",
    "crates/hallpass-cli",
    "crates/hallpass-ui",
    "xtask",
]
# NOTE: crates/hallpass-ebpf is intentionally NOT a workspace member.
# Following the aya convention, it is a separate no_std crate built via xtask.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# default-features off drops heapless and its unmaintained atomic-polyfill.
postcard = { version = "1", default-features = false, features = ["use-std"] }
tokio = { version = "1", default-features = false }
tracing = "0.1"
thiserror = "2"
sha2 = "0.10"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

# Line tables keep file:line in backtraces at a fraction of the disk.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
