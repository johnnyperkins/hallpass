version: 2

# The workflow pins every third-party action to a commit SHA, which stops an
# upstream tag move from changing what runs here but also means nothing ever
# updates on its own. Dependabot is the other half of that trade: it opens the
# pull request that moves a pin forward, so the pins stay deliberate instead of
# quietly ageing into unpatched versions.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    # Actions follow semver, so a minor bump is safe to batch. A major one
    # still gets a pull request of its own.
    groups:
      actions:
        update-types: [minor, patch]

  # The workspace lockfile is committed and `cargo deny check` gates licences
  # and advisories in CI, so a dependency bump gets reviewed the same way any
  # other change does.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # A dependency joins the first group that matches it.
    groups:
      # eframe, egui_extras and egui_kittest share one egui, so a bump to
      # any one of them alone does not compile.
      egui:
        patterns: ["eframe", "egui*"]
      # Patch releases only. Most of the crates here are 0.x, where a
      # "minor" bump such as 0.35 to 0.36 is a breaking release, and those
      # deserve a pull request of their own.
      patch:
        update-types: [patch]

  # crates/hallpass-ebpf is deliberately not a workspace member (it builds for
  # bpfel-unknown-none on nightly), so it has its own lockfile that the entry
  # above cannot see.
  - package-ecosystem: cargo
    directory: /crates/hallpass-ebpf
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch:
        update-types: [patch]
