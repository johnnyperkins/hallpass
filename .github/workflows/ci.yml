name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only by default. Nothing here publishes, comments, or writes to the
# repo, and the e2e job runs a freshly built binary as root on the runner, so
# the token it can reach should be able to do as little as possible.
permissions:
  contents: read

# A new push supersedes the one before it on the same ref. The e2e job takes
# root and network namespaces, so leaving stale runs queued costs real time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a full commit SHA, not a tag or branch:
# a tag can be moved and `@stable` is a branch, so either would let an
# upstream change run new code here without a commit in this repo. The
# trailing comment records which release each SHA is. Dependabot
# (.github/dependabot.yml) proposes the bumps so the pins do not rot.
# `dtolnay/rust-toolchain` publishes no release tags; its branch names are the
# toolchain selector, so the pin is the head of the `stable` branch.

jobs:
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and a token left in .git/config is readable by
          # every build script and by the root e2e step.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # fuzz/ has its own lockfile that Dependabot does not update, and it
      # shares crates with the workspace, so a bump here can leave it stale.
      - name: Fuzz lockfile
        run: cargo xtask fuzz-lock
      # The e2e tests are #[ignore]-gated (need root + netns) and run in
      # the e2e job; the nightly-only hallpass-ebpf build has its own job.
      - name: Test
        shell: bash
        run: cargo test --workspace 2>&1 | tee test.log
      - name: Annotate test failures
        if: failure()
        run: .github/annotate-failures.sh test.log
      # `cargo xtask lint` runs this plus the two clippy invocations in the
      # ebpf job below, so one local command covers every lint gate here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  ebpf:
    name: ebpf feature build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rustup auto-installs the nightly + rust-src pinned by
      # crates/hallpass-ebpf/rust-toolchain.toml on first use.
      - name: Install bpf-linker
        # Pinned: this compiles and runs third-party code in the job, so the
        # version that linked the kernel object should change only when this
        # file does. --locked also holds bpf-linker's own dependency tree.
        run: cargo install bpf-linker --locked --version 0.10.4
      - name: Build eBPF object
        run: cargo xtask build-ebpf
      # crates/hallpass-ebpf is not a workspace member, so the clippy job
      # cannot reach it. It holds every `unsafe` in the project and runs in
      # the kernel, so it is the last crate that should go unlinted.
      - name: Clippy (ebpf kernel programs)
        run: cargo xtask clippy-ebpf
      - name: Clippy (ebpf feature)
        run: cargo clippy -p hallpassd --all-targets --features ebpf -- -D warnings
      # The plain test job never enables the feature, so the tests gated
      # on it (attribution/ebpf.rs unit tests) only run here. The e2e
      # suite stays #[ignore]-gated and runs in the e2e job.
      - name: Test (ebpf feature)
        run: cargo test -p hallpassd --features ebpf

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # RUSTDOCFLAGS=-D warnings (set inside the task) is the point: the doc
      # comments carry the security reasoning and lean on intra-doc links, and
      # a link that stops resolving degrades to plain text with no other
      # signal. This job does not build the ebpf feature, so it needs no
      # nightly toolchain and no bpf-linker.
      - name: Docs
        run: cargo xtask doc

  e2e:
    name: e2e (root + netns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tools
        # iproute2 and python3 ship with the runner image; the suite also
        # needs nft and nc.
        run: sudo apt-get update && sudo apt-get install -y nftables netcat-openbsd
      # The uprobe test needs the ebpf feature, and the skip-marker guard
      # below treats any skip as a broken environment, so the binary must
      # be built with the feature (which needs the eBPF object first).
      - name: Install bpf-linker
        run: cargo install bpf-linker --locked --version 0.10.4
      - name: Build eBPF object
        run: cargo xtask build-ebpf
      # Build unprivileged so the cache and target/ stay runner-user-owned;
      # only the test run itself needs root.
      # The session-grant tests drive the real CLI wrapper, which is not a
      # dependency of the daemon and so is not built by the line below. The
      # suite skips those tests when it is missing, and the skip guard on
      # the run step turns a skip into a failed job.
      - name: Build the CLI (driven by the session-grant tests)
        run: cargo build -p hallpass-cli
      - name: Build e2e test binary
        run: cargo test -p hallpassd --test e2e --features ebpf --no-run
      - name: Run e2e tests
        # --test-threads=1: the tests share fixed namespace names.
        # The suite skips gracefully (and passes) when the environment is
        # unusable; grep for the skip marker so a broken root or tool setup
        # fails the job instead of going silently green. --nocapture because
        # the harness hides stderr of passing tests.
        #
        # This is the one step that runs project code as root. It stays a
        # `cargo test` rather than the prebuilt binary because cargo picks
        # the test binary by hash and the hash changes with every source
        # edit; the build above is what keeps the compile unprivileged, so
        # cargo has nothing left to do here but launch. `sudo cargo` is
        # avoided locally for a different reason (root-owned files in
        # target/); on a throwaway runner that does not matter.
        shell: bash
        run: |
          sudo -E "$(command -v cargo)" test -p hallpassd --test e2e --features ebpf -- --ignored --test-threads=1 --nocapture 2>&1 | tee e2e.log
          ! grep -q 'SKIP e2e' e2e.log
      - name: Annotate e2e failures
        if: failure()
        run: .github/annotate-failures.sh e2e.log

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # The eBPF crate is not a workspace member and has its own lockfile,
      # which the step above never reads.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: crates/hallpass-ebpf/Cargo.toml
