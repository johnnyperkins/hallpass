name: Release

# A pushed v* tag builds the release with `cargo xtask dist` and publishes
# it. Nothing else triggers this, and nothing here runs on pull requests.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish
    # The oldest supported runner, not ubuntu-latest: the binaries link the
    # glibc they were built against, and an older one runs on more hosts.
    runs-on: ubuntu-22.04
    permissions:
      # Creating the release and uploading its files.
      contents: write
      # Signing the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      # Pins and their comments follow ci.yml; Dependabot bumps both files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
      # No build cache, unlike CI: a cache is written by every branch's CI
      # runs, and what ships should be built from the tagged source alone.
      - name: Install bpf-linker
        run: cargo install bpf-linker --locked --version 0.10.4
      - name: Check the tag matches the version and the changelog
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hallpassd") | .version')
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $crate"
            exit 1
          fi
          # The release notes are the changelog's section for this version,
          # so a release without one fails here rather than shipping blank.
          awk -v h="## $version" '
            $0 == h || index($0, h " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
      - name: Build
        run: cargo xtask dist
      # Signed provenance for every published file: which workflow, commit
      # and runner built it. Check with `gh attestation verify <file>
      # --repo johnnyperkins/hallpass`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" target/dist/*
          --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
